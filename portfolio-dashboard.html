  function fmt(n){
    if(n===null||n===undefined||n==='') return '-';
    const num = Number(n);
    if(isNaN(num)) return n;
    return num.toLocaleString(undefined,{maximumFractionDigits:2});
  }

  function sessionsElapsed(confirmDateStr, now){
    if(!confirmDateStr) return null;
    const confirm = new Date(confirmDateStr);
    if(isNaN(confirm.getTime())) return null;
    let sessions = 0;
    let cursor = new Date(confirm.getTime());
    for(let i=0;i<60;i++){
      cursor = new Date(cursor.getTime() + 24*3600*1000);
      if(cursor.getTime() <= now.getTime()) sessions++;
      else break;
    }
    return sessions;
  }

  function stageInfo(confirmDateStr, requiredSessions){
    requiredSessions = requiredSessions || 1;
    if(!confirmDateStr) return {label:'1단계 확인일 미입력 — 입력 전까지는 판단 불가', cls:'wait', sessions:null};
    const sessions = sessionsElapsed(confirmDateStr, new Date());
    if(sessions === null) return {label:'날짜 형식 오류', cls:'wait', sessions:null};
    if(sessions === 0) return {label:`1단계(돌파) 확인완료 · ${requiredSessions}세션 연속유지 확인 대기중 (0/${requiredSessions})`, cls:'wait', sessions};
    if(sessions < requiredSessions) return {label:`돌파 후 ${sessions}세션 경과 (${sessions}/${requiredSessions}) — 아직 유지 확인 세션 부족`, cls:'wait', sessions};
    return {label:`돌파 후 ${sessions}세션 경과 — ${requiredSessions}세션 연속유지 기준 충족 가능 시점, 해당 세션 종가가 기준선 위인지 직접 확인 필요`, cls:'check', sessions};
  }

  function stopStatus(currentPrice, stop1, stop2){
    if(currentPrice===null||currentPrice===undefined||currentPrice==='') return null;
    const cp = Number(currentPrice);
    if(isNaN(cp)) return null;
    const PROX_PCT = 1.5; // daily_check.py의 PROXIMITY_PCT와 동일 기준
    const hasS1 = stop1!==null && stop1!==undefined && stop1!=='';
    const hasS2 = stop2!==null && stop2!==undefined && stop2!=='';
    if(hasS2 && cp <= Number(stop2)){
      return {label:'2차 손절선 하회', cls:'s2'};
    }
    if(hasS1 && cp <= Number(stop1)){
      return {label:'1차 손절선 하회', cls:'s2'};
    }
    if(hasS1 && cp <= Number(stop1) * (1 + PROX_PCT/100)){
      return {label:'1차 손절선 근접', cls:'s1'};
    }
    if(hasS2 && cp <= Number(stop2) * (1 + PROX_PCT/100)){
      return {label:'2차 손절선 근접', cls:'s1'};
    }
    return {label:'손절선 위 (정상)', cls:'ok'};
  }

  function returnBadge(avgPrice, currentPrice){
    if(avgPrice===null||avgPrice===undefined||avgPrice===''||currentPrice===null||currentPrice===undefined||currentPrice==='') return null;
    const ap = Number(avgPrice), cp = Number(currentPrice);
    if(isNaN(ap) || isNaN(cp) || ap === 0) return null;
    const pct = ((cp - ap) / ap) * 100;
    const sign = pct >= 0 ? '+' : '';
    return {label:`수익률 ${sign}${pct.toFixed(2)}%`, cls: pct >= 0 ? 'up' : 'down'};
  }

  function addTriggerStatus(currentPrice, addTrigger){
    if(currentPrice===null||currentPrice===undefined||currentPrice===''||addTrigger===null||addTrigger===undefined||addTrigger==='') return null;
    const cp = Number(currentPrice), at = Number(addTrigger);
    if(isNaN(cp) || isNaN(at) || at === 0) return null;
    const distPct = ((cp - at) / at) * 100;
    if(cp <= at){
      return {label:'추매 조건 발동 (기준선 이하)', cls:'s2'};
    }
    if(distPct <= 5){
      return {label:`추매선 근접 (기준선까지 ${distPct.toFixed(1)}%)`, cls:'s1'};
    }
    return null;
  }

  function promotionStatus(currentPrice, addLevel){
    if(currentPrice===null||currentPrice===undefined||currentPrice===''||addLevel===null||addLevel===undefined||addLevel==='') return null;
    const cp = Number(currentPrice), al = Number(addLevel);
    if(isNaN(cp) || isNaN(al) || al === 0) return null;
    if(cp >= al){
      return {label:'승격선 돌파', cls:'s2'};

    const distPct = ((al - cp) / cp) * 100;
    if(distPct <= 5){
      return {label:`승격선 근접 (승격선까지 +${distPct.toFixed(1)}%)`, cls:'s1'};
    }
    return null;
  }

  function entryLevelStatus(currentPrice, level){
    if(currentPrice===null||currentPrice===undefined||currentPrice===''||level===null||level===undefined||level==='') return null;
    const cp = Number(currentPrice), lv = Number(level);

    }
    return null;
  }

  async function fetchLatestPrices(symbols){
    const prompt = '다음 종목 각각에 대해 Alpha Vantage의 GLOBAL_QUOTE 도구를 종목당 한 번씩 개별 호출해줘. entitlement 파라미터는 절대 지정하지 마(기본값 사용, delayed/realtime 지정 시 이 키는 구독 오류가 남). REALTIME_BULK_QUOTES는 승인 절차 때문에 이 환경에서 실패하니 사용하지 마. GLOBAL_QUOTE 응답의 price 필드 값을 그대로 사용하고, 절대 추정하거나 지어내지 마. 도구 호출이 오류를 반환한 종목은 반드시 그 키 값을 null로 넣어(추정값 금지). 결과는 다른 설명이나 코드블록 표시 없이 순수 JSON 객체 하나로만 답해. 형식: {"SYMBOL": price_number_or_null}. 조회할 종목: ' + JSON.stringify(symbols);
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        mcp_servers: [{ type: "url", url: "https://mcp.alphavantage.co/mcp", name: "alpha-vantage" }]
      })
    });
    if(!response.ok){
      throw new Error('API 응답 오류: ' + response.status);
    }
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    const clean = textBlocks.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  }

  function holdingCard(acc, idx, h, fields){
    const priceField = fields.find(f => f.key === 'currentPrice');
    const gridFields = fields.filter(f => f.key !== 'currentPrice');
    const rows = gridFields.map(f => {
      const val = h[f.key];
      const id = `f-${acc}-${idx}-${f.key}`;
      return `<div class="pd-field"><span class="pd-flabel">${f.label}</span><input class="pd-finput" id="${id}" type="${f.type||'number'}" value="${val===null||val===undefined?'':val}" data-acc="${acc}" data-idx="${idx}" data-key="${f.key}" ${f.type==='text'?'':'step="any"'}></div>`;
    }).join('');
    let extra = '';
    if(h.note !== undefined){
      extra = `<div><label style="font-size:9.5px;color:#8B92A0;display:block;margin:4px 0 2px;">메모</label><textarea rows="3" class="pd-notearea" data-acc="${acc}" data-idx="${idx}" data-key="note">${h.note||''}</textarea></div>`;
    }
    let eventHtml = '';
    let statusHtml = '';
    let headMeta = '';
    if(priceField){
      const id = `f-${acc}-${idx}-currentPrice`;
      const prefix = priceField.label.includes('원') ? '' : '$';
      headMeta += `<span style="font-size:11px;color:#5C6470;">${prefix}</span><input class="pd-finput pd-live pd-headprice" id="${id}" type="number" step="any" value="${h.currentPrice===null||h.currentPrice===undefined?'':h.currentPrice}" data-acc="${acc}" data-idx="${idx}" data-key="currentPrice" title="${priceField.label}">`;
    }
    if(h.avgPrice !== undefined && h.currentPrice !== undefined){
      const rb = returnBadge(h.avgPrice, h.currentPrice);
      if(rb) headMeta += `<span class="pd-badge ${rb.cls}" style="margin-top:0;">${rb.label}</span>`;
    }
    // ── 과거 확정 사건 (시간순: 승격완료 → 승격선돌파/2차추매완료 → 1차손절집행) ──
    if(acc === 'acc2' && h.promoted){
      eventHtml += `<span class="pd-badge done">승격 완료(4→2, ${h.promoDate||'?'} @$${h.promoPrice!==undefined?h.promoPrice:'?'})</span>`;
    }
    if(h.promoBreakDate && h.addLevel !== undefined && h.addLevel !== null && h.currentPrice !== undefined && h.currentPrice !== null && Number(h.currentPrice) < Number(h.addLevel)){
      // 2026-09-14: 재하락 중엔 배지 자체를 숨김(이전엔 "돌파확정"+"재하락중" 두 배지를 같이 띄웠으나 헷갈린다는 지적으로 단순화).
      // promoBreakDate/Price 데이터는 그대로 보존 — 재돌파 시 그 값을 갱신하면 배지가 다시 뜸.
    } else if(h.promoBreakDate){
      // 9/9: promoBreakDate가 있으면 승격선을 이미 확정 돌파한 것 — addLevel 필드가 별도 목적(2차추매선 등)으로
      // 재사용된 경우(HOOD 등) 현재가 vs addLevel 비교로는 이 사실이 안 드러나므로, 여기서 확정 배지로 못박는다.
      eventHtml += `<span class="pd-badge s2">승격선 돌파 확정(${h.promoBreakDate} @$${h.promoBreakPrice!==undefined?h.promoBreakPrice:'?'})</span>`;
    } else if(h.addLevel !== undefined && h.currentPrice !== undefined && acc === 'acc2' && h.confirmDate){
      // 9/7: 이미 2차 추매 완료된 종목(ANET/PLTR 등)이 이후 눌림으로 addLevel 부근/아래로 재하락해도
      // '승격선 근접/돌파' 배지가 다시 뜨는 문제 수정 — confirmDate가 있으면 이미 실행 완료된 트리거이므로 고정 배지로 대체
      eventHtml += `<span class="pd-badge done">2차 추매 완료</span>`;
    }
    if(h.stop1Status === 'executed' && h.stop2!==undefined && h.stop2!==null && h.stop2!==''){
      eventHtml += `<span class="pd-badge done">1차 손절 집행완료 · 2차 감시중</span>`;
    } else if(h.stop1Status === 'undetermined' && (h.stop1===null||h.stop1===undefined||h.stop1==='')){
      // 9/14: stop1이 null인 이유가 "이미 집행돼서 지웠다"가 아니라 "애초에 값을 못 잡아 보류 중"인
      // 경우(BTC 등)를 구분 — 두 경우를 같은 배지로 뭉뚱그리면 안 된다는 사용자 지적으로 신설
      eventHtml += `<span class="pd-badge wait">1차 손절가 미확정(보류)</span>`;
    }
    // ── 현재 진행중 상태 (손절선 대비 → 추매트리거 → 승격선/2차추매선 근접 → 돌파후 수익률) ──
    if(h.currentPrice !== undefined && (h.stop1 !== undefined || h.stop2 !== undefined)){
      const st = stopStatus(h.currentPrice, h.stop1, h.stop2);
      if(st) statusHtml += `<span class="pd-badge ${st.cls}">${st.label}</span>`;
    }
    if(h.addTrigger !== undefined && h.currentPrice !== undefined){
      const at = addTriggerStatus(h.currentPrice, h.addTrigger);
      if(at) statusHtml += `<span class="pd-badge ${at.cls}">${at.label}</span>`;
    }
    if(!h.promoBreakDate && h.addLevel !== undefined && h.currentPrice !== undefined && !(acc === 'acc2' && h.confirmDate)){
      if(acc === 'acc2'){
        // 9/9: acc2에서 addLevel은 '2차 추매선' 의미이므로 '승격선'이라는 문구를 쓰지 않고 별도 라벨 사용
        const ps2 = promotionStatus(h.currentPrice, h.addLevel);
        if(ps2){
          const label2 = ps2.label.replace('승격선', '2차 추매선');
          statusHtml += `<span class="pd-badge ${ps2.cls}">${label2}</span>`;
        }
      } else {
        const ps = promotionStatus(h.currentPrice, h.addLevel);
        if(ps) statusHtml += `<span class="pd-badge ${ps.cls}">${ps.label}</span>`;
      }
    }
    // 2차추매선(secondAddLevel)이 별도로 있으면 그 값을 표시 (addLevel=승격선과 별개 필드)
    if(h.secondAddLevel !== undefined && h.secondAddLevel !== null && h.secondAddLevel !== '' && h.currentPrice !== undefined){
      const psExtra = promotionStatus(h.currentPrice, h.secondAddLevel);
      if(psExtra){
        const labelExtra = psExtra.label.replace('승격선', '2차 추매선');
        statusHtml += `<span class="pd-badge ${psExtra.cls}">${labelExtra}</span>`;
      }
    }
    if(h.promoBreakPrice !== undefined && h.promoBreakPrice !== null && h.promoBreakPrice !== '' && h.currentPrice !== undefined){
      const rb2 = returnBadge(h.promoBreakPrice, h.currentPrice);
      // 2026-09-14 명시: 재돌파(돌파→재하락→재돌파) 시 promoBreakDate/Price는 항상 최신 재돌파 값으로 갱신 —
      // 최초 돌파 종가 기준 누적수익률이 아니라 최근 재돌파 종가부터의 수익률이 슬롯경쟁 순위기준
      if(rb2) statusHtml += `<span class="pd-badge ${rb2.cls}" title="승격선 돌파종가(${h.promoBreakDate||'?'}) 대비 수익률 — 계좌2 진입경쟁 순위비교 기준(재돌파 시 최신 돌파일 기준으로 갱신)">돌파후 ${rb2.label}</span>`;
    }
    statusHtml = eventHtml + statusHtml;
    let stageHtml = '';
    if(h.confirmDate !== undefined){
      const info = stageInfo(h.confirmDate, h.requiredSessions);
      stageHtml = `
        <div style="margin-top:6px;">
          <div class="pd-field"><span class="pd-flabel" style="min-width:auto;">1단계확인</span><input type="datetime-local" value="${h.confirmDate||''}" data-acc="${acc}" data-idx="${idx}" data-key="confirmDate"></div>
          <div class="pd-badge ${info.cls}" style="display:block;margin-top:4px;white-space:normal;">${info.label}</div>
        </div>`;
    }
    const acctBadge = h.account ? `<span class="pd-badge ${h.account==='IRP'?'s1':'done'}" style="margin:0 0 0 6px;">${h.account}</span>` : '';
    return `<div class="pd-holding">
      <div class="pd-cardhead">
        <span class="pd-symbol">${h.symbol}</span>${acctBadge}
        <span class="pd-headmeta-wrap">${headMeta}</span>
      </div>
      ${rows ? `<div class="pd-row">${rows}</div>` : ''}
      ${extra}
      ${statusHtml ? `<div>${statusHtml}</div>` : ''}
      ${stageHtml}
    </div>`;
  }

            <div style="font-size:11px;color:#8B92A0;">${s.reason} (${s.date})</div>
          </div>`).join('')
        : '') +
      `<div class="pd-note" style="color:#8B92A0;margin-top:6px;">${state.crypto.note}</div>` +
      saveBtn('crypto'),
      'crypto', '시세'
    );

    el.innerHTML = html;
    attachHandlers();
  }

  function sectionWrap(key, title, sub, bodyHtml, fetchAcc, fetchLabel){
    const open = state._open[key];
    let subText = sub;
    if(fetchAcc){
      const lf = state[fetchAcc].lastFetched;
      if(lf) subText += ` · 조회 ${new Date(lf).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`;
    }
    const fetchBtn = fetchAcc ? `<button class="ghost pd-headfetch" data-fetch="${fetchAcc}">${fetchLabel||'시세'}</button>` : '';
    return `<div class="pd-sec">
      <div class="pd-sec-head" data-toggle="${key}">
        <div><div class="pd-sec-title">${title}</div><div class="pd-sec-sub">${subText}</div></div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${fetchBtn}
          <span style="font-size:14px;color:#8B92A0;">${open?'▾':'▸'}</span>
        </div>
      </div>
      ${open?`<div class="pd-sec-body">${bodyHtml}</div>`:''}
    </div>`;
  }

  function saveBtn(acc){
    return `<button class="primary" data-save="${acc}" style="width:100%;margin-top:4px;">이 계좌 저장</button>`;
  }

  async function handleFetch(acc, btn){
    const statusEl = document.getElementById(`pd-fetchstatus-${acc}`);
    const symbols = state[acc].holdings.map(h => h.symbol);
    btn.disabled = true;
    btn.textContent = '조회 중...';
    if(statusEl) statusEl.textContent = 'Alpha Vantage 조회 중...';
    try{
      const prices = await fetchLatestPrices(symbols);
      state[acc].holdings.forEach(h=>{
        if(prices[h.symbol] !== undefined && prices[h.symbol] !== null){
          h.currentPrice = prices[h.symbol];
        }
      });
      state[acc].lastFetched = new Date().toISOString();
      render();
    }catch(e){
      if(statusEl) statusEl.textContent = '조회 실패 — 직접 입력해주세요 (' + e.message + ')';
      btn.disabled = false;
      btn.textContent = '시세';
    }
  }

  function attachHandlers(){
    document.querySelectorAll('[data-toggle]').forEach(node=>{
      node.addEventListener('click', ()=> toggleSection(node.getAttribute('data-toggle')));
    });
    document.querySelectorAll('input[data-acc], textarea[data-acc]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const acc = inp.getAttribute('data-acc');
        const idx = inp.getAttribute('data-idx');
        const key = inp.getAttribute('data-key');
        let value = inp.value;
        if(inp.tagName === 'INPUT' && inp.type === 'number' && value !== ''){
          value = Number(value);
        }
        if(String(idx).startsWith('reentry-')){
          const i = Number(idx.split('-')[1]);
          state[acc].reentry[i][key] = value;
        } else if(acc === 'acc3watch'){
          state.acc3.watchTargets[Number(idx)][key] = value;
        } else if(acc === 'acc4watch'){
          state.acc4.entryWatch[Number(idx)][key] = value;
        } else {
          state[acc].holdings[Number(idx)][key] = value;
        }
        // 9/7: 필드 하나 바뀔 때마다 즉시 자동저장 — 계좌별 "저장" 버튼을 따로 누르지 않아 값이
        // window.storage에 반영되지 못한 채 새로고침/재발행 시 유실되던 문제(1번계좌 추매트리거·평단 등) 방지
        try{
          await saveState();
          const stamp = document.getElementById('pd-updated');
          if(stamp) stamp.textContent = '마지막 저장: ' + new Date().toLocaleString('ko-KR') + ' (자동)';
        }catch(e){}
        if(key === 'confirmDate' || key === 'currentPrice'){
          render();
        }
      });
    });
    document.querySelectorAll('[data-fetch]').forEach(btn=>{
      btn.addEventListener('click', (e)=> { e.stopPropagation(); handleFetch(btn.getAttribute('data-fetch'), btn); });
    });
    document.querySelectorAll('[data-save]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        btn.textContent = '저장 중...';
        await saveState();
        btn.textContent = '이 계좌 저장';
        document.getElementById('pd-updated').textContent = '마지막 저장: ' + new Date().toLocaleString('ko-KR');
      });
    });
  }

  (async function init(){
    await loadState();
    render();
    document.getElementById('pd-updated').textContent = '값을 불러왔습니다';
    const resetBtn = document.getElementById('pd-reset-btn');
    if(resetBtn){
      resetBtn.addEventListener('click', async ()=>{
        if(!confirm('저장된 값을 지우고 이 파일의 최신 기본값으로 초기화합니다. 직접 입력했던 수정값은 사라집니다. 계속할까요?')) return;
        resetBtn.textContent = '초기화 중...';
        state = JSON.parse(JSON.stringify(defaultState));
        migrateState();
        try{ await saveState(); }catch(e){}
        render();
        resetBtn.textContent = '⟳ 최신 기본값으로 초기화 (이 파일에 저장된 최신 데이터로 덮어씀 — 직접 입력한 값은 사라짐)';
        document.getElementById('pd-updated').textContent = '초기화 완료: ' + new Date().toLocaleString('ko-KR');
      });
    }
  })();
})();
</script>
